# 临时: 用真实凭据链验证 tyrzLogin 在其它出口是否可用。只读，不签到、不领取、不打印任何密钥。
name: egress-probe (临时·只读·探完即删)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: deps
        run: pip install -q requests pycryptodome
      - name: probe
        env:
          ydyp: ${{ secrets.YDYP_PROBE_TMP }}
        run: |
          cd scripts && python3 -u - <<'PY'
          import os, socket, sys, json, requests, base64
          socket.setdefaulttimeout(25)
          sys.path.insert(0, '.')
          import mcloud
          raw = os.environ.get('ydyp', '').strip().strip("'")
          print('账号数:', len(raw.split('&')) if raw else 0)
          if not raw:
              sys.exit('没有 ydyp')
          yp = mcloud.YP(raw.split('&')[0])
          print('refresh:', 'OK' if yp.refresh_authorization_token() else 'FAIL')
          tok = yp.sso()
          print('ssoToken:', ('OK len=%d' % len(tok)) if tok else 'FAIL')
          if not tok:
              sys.exit(1)
          for base in ('https://caiyun.feixin.10086.cn:7071', 'https://caiyun.feixin.10086.cn',
                       'https://m.mcloud.139.com'):
              u = f'{base}/portal/auth/tyrzLogin.action?ssoToken={tok}'
              try:
                  r = requests.post(u, headers=yp.jwtHeaders, timeout=25)
                  try:
                      j = r.json()
                      code = j.get('code'); has = bool((j.get('result') or {}).get('token'))
                      print(f'tyrzLogin {base}: HTTP={r.status_code} code={code} 取到JWT={has}')
                      if has:
                          jt = j['result']['token']
                          print('  JWT长度:', len(jt))
                          # 只读: 用 JWT 查签到状态，不做任何写操作
                          yp.build_market_context(jt)
                          q = yp.request_market_json(f'{yp.market_base_url}/market/signin/page/infoV3',
                                                     params={'client': 'app'})
                          res = (q or {}).get('result') or {}
                          print('  infoV3 code=', (q or {}).get('code'),
                                'todaySignIn=', res.get('todaySignIn'),
                                'total=', res.get('total'), 'toReceive=', res.get('toReceive'))
                          sys.exit(0)
                  except ValueError:
                      print(f'tyrzLogin {base}: HTTP={r.status_code} 非JSON: {r.text[:60]!r}')
              except Exception as e:
                  print(f'tyrzLogin {base}: ERR {type(e).__name__}')
          print('结论: 所有候选落点均未能换取 JWT')
          PY
      - name: 说明
        run: echo "本 workflow 不执行签到/领取等写操作; 探完即删除, 并清理临时 secret。"
